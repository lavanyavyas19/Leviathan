[pytest]
# leviathan-backend/pytest.ini
# Run from leviathan-backend/ with:
#   pytest                          # all tests
#   pytest -m bug001                # BUG-001 fix only
#   pytest -m "not slow"            # exclude long-running tests
#   pytest -v --tb=long             # verbose with full tracebacks

testpaths    = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers

markers =
    bug001:  Sort-avoidance full per-group check (BUG-001)
    bug002:  True last-row selection for vessel logs (BUG-002)
    bug003:  tracemalloc nesting guard (BUG-003)
    bug004:  np.nan vs None for numeric payload fields (BUG-004)
    bug005:  time_gap clip and acceleration cap (BUG-005)
    feature: Core feature engineering correctness
    payload: Payload size and shape validation
    parquet: Parquet round-trip dtype preservation
    slow:    Tests that take > 5 s — exclude with -m "not slow"
